[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voltage-sweep-cycles"
version = "0.1.0"
description = "Cycle detection and SET/RESET labeling for voltage sweep data"
authors = [
    {name = "Rohit Attri"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "numpy"
]

[tool.setuptools.packages.find]
where = ["."]
